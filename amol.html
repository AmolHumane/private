
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Will You Be Mine?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#1c1033; --bg2:#3a1450; --rose:#ff5d8f; --peach:#ffb88c; --lilac:#d6c8ff; --text:#fff4f8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:'DM Sans',system-ui,sans-serif; color:var(--text); text-align:center;
  background:var(--bg1);
  padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);
  overflow-x:hidden;
}
#hearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.heart{position:absolute;bottom:-40px;opacity:.0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.7}100%{transform:translateY(-110vh) rotate(25deg);opacity:0}}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:36px 0 24px}
h1{font-family:'Caveat',cursive;font-size:clamp(2.6rem,11vw,4rem);margin:0 0 6px;color:var(--peach);line-height:1}
/* Background: if you add a photo named bg.jpg next to index.html it shows on top.
   Otherwise the built-in romantic sunset artwork below is used (always works, no internet needed). */
#bg{position:fixed;inset:0;z-index:0;
  background:
    linear-gradient(180deg,rgba(28,16,51,.25) 0%,rgba(28,16,51,.7) 100%),
    url("bg.jpg") center/cover no-repeat,
    url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='1000' viewBox='0 0 800 1000'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='rgb(40,18,70)'/><stop offset='.55' stop-color='rgb(150,50,110)'/><stop offset='1' stop-color='rgb(255,140,120)'/></linearGradient><radialGradient id='m'><stop offset='0' stop-color='rgb(255,230,215)' stop-opacity='.85'/><stop offset='1' stop-color='rgb(255,230,215)' stop-opacity='0'/></radialGradient></defs><rect width='800' height='1000' fill='url(%23g)'/><circle cx='560' cy='330' r='260' fill='url(%23m)'/><circle cx='560' cy='330' r='100' fill='rgb(255,232,220)'/><g fill='white' opacity='.8'><circle cx='90' cy='120' r='2'/><circle cx='220' cy='210' r='1.6'/><circle cx='330' cy='90' r='2.2'/><circle cx='700' cy='140' r='2'/><circle cx='430' cy='200' r='1.5'/><circle cx='140' cy='330' r='1.8'/><circle cx='740' cy='430' r='1.6'/></g><path d='M0 800 Q200 720 400 790 T800 770 V1000 H0Z' fill='rgb(60,24,84)'/><path d='M0 880 Q250 820 500 870 T800 850 V1000 H0Z' fill='rgb(24,10,40)'/><g fill='rgb(24,10,40)'><circle cx='340' cy='742' r='20'/><rect x='322' y='764' width='36' height='92' rx='12'/><circle cx='412' cy='752' r='18'/><path d='M402 770 h20 l26 90 h-72Z'/></g><path d='M358 788 Q378 808 392 790' stroke='rgb(24,10,40)' stroke-width='8' fill='none' stroke-linecap='round'/><g fill='rgb(255,93,143)' opacity='.9'><path transform='translate(378 650) scale(1.1)' d='M0 -6 C-10 -18 -26 -2 0 18 C26 -2 10 -18 0 -6Z'/><path transform='translate(430 590) scale(.7)' d='M0 -6 C-10 -18 -26 -2 0 18 C26 -2 10 -18 0 -6Z'/><path transform='translate(330 580) scale(.55)' d='M0 -6 C-10 -18 -26 -2 0 18 C26 -2 10 -18 0 -6Z'/></g></svg>") center bottom/cover no-repeat,
    radial-gradient(1200px 700px at 50% -10%,var(--bg2),var(--bg1))}
.adv{font-size:1.1rem;color:var(--peach);margin:0 auto 10px;max-width:34ch}
h1,#msg,#ask h2,#hint{text-shadow:0 2px 14px rgba(0,0,0,.55)}
#msg{color:#f1e9ff}
#msg{min-height:9.5em;font-size:1.08rem;line-height:1.65;color:var(--lilac);max-width:46ch;margin:0 auto}
#msg .cursor{display:inline-block;width:2px;height:1.1em;background:var(--rose);vertical-align:-3px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#ask{opacity:0;transform:translateY(12px);transition:opacity .8s,transform .8s;margin-top:10px}
#ask.show{opacity:1;transform:none}
#ask h2{font-family:'Caveat',cursive;font-size:clamp(2rem,8vw,2.8rem);margin:0 0 6px}
#hint{min-height:1.5em;color:var(--peach);font-size:.95rem;margin:4px 0 14px}
.btns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;min-height:64px}
button{font:inherit;font-weight:700;border:0;border-radius:999px;cursor:pointer;padding:15px 28px;color:#fff;touch-action:manipulation;transition:transform .15s,box-shadow .2s}
button:focus-visible,.name:focus-visible{outline:3px solid var(--lilac);outline-offset:3px}
.yes{background:linear-gradient(135deg,var(--rose),#ff8a5c);box-shadow:0 8px 24px rgba(255,93,143,.45)}
.yes:hover{transform:scale(1.06)}
.yes.big{background:linear-gradient(135deg,#ff2f78,var(--rose));font-size:1.1rem}
#no{background:#4a3a66;color:#e8def8}
#no.dodging{position:fixed;z-index:50;transition:left .18s ease-out,top .18s ease-out}
.done{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 140px);min-height:calc(100svh - 140px);padding-top:30vh}
.wa{display:inline-block;margin-top:18px;padding:15px 26px;border-radius:999px;background:#25d366;color:#073b1d;font-weight:700;text-decoration:none;box-shadow:0 8px 24px rgba(37,211,102,.35)}
.wa:focus-visible{outline:3px solid var(--lilac);outline-offset:3px}
.done h2{font-family:'Caveat',cursive;font-size:clamp(2.4rem,10vw,3.4rem);color:var(--peach);margin:10px 0}
.done p{color:var(--lilac);margin:6px 0}
#status{font-size:.85rem;opacity:.75}
footer{position:relative;z-index:1;font-size:.82rem;color:rgba(255,244,248,.6);padding:26px 0 18px}
footer{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
footer a{color:inherit;white-space:nowrap}
footer .copy{display:block}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:100}
@media (prefers-reduced-motion:reduce){.heart{display:none}#no.dodging{transition:none}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div id="hearts" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<main>
  <section id="ask-wrap">
    <h1>Hey Dear,</h1>
    <p id="msg" aria-live="polite"></p>

    <div id="ask">
      <p class="adv">Life is an adventure, and I want to embark on the craziest journey with you!</p>
      <h2>Will you be mine?</h2>
      <p id="hint"></p>
      <div class="btns" id="btns">
        <button class="yes" data-answer="Yes, I'm in!">Yes, I'm in! 💖</button>
        <button id="no" type="button">No</button>
      </div>
    </div>
  </section>

  <section class="done" id="done">
    <h2>You said yes! 🎉</h2>
    <p>Your answer has been sent to Amol. Thank you for making his day. 💕</p>
    <a class="wa" href="https://wa.me/917057868144?text=Hi%20Amol%2C%20I%20said%20yes!%20%F0%9F%92%96" target="_blank" rel="noopener">Message Amol on WhatsApp 💬</a>
    <p id="status"></p>
  </section>
</main>

<footer>
  <span class="copy">Amol Humane &copy; <span id="year"></span>. All rights reserved.</span>
  <a class="tel" href="tel:+917057868144">+91&nbsp;7057868144</a>
</footer>

<script>
/* ===== SETTINGS ===== */
// 1) Get a free key at https://web3forms.com (enter your email, they mail you the key)
// 2) Paste it below. Every answer will arrive in your inbox.
const WEB3FORMS_KEY = "b5c11d5b-c379-4177-afdf-7068d6cecf3a";

const MESSAGE = "You deserve the greatest, someone who will support you unrestrictedly, allow you to develop unrestrictedly, and love you endlessly. Do you want to let me be the one? I will take care of you entire life. Once you hold my hand I will hold it forever. Would you like to live and enjoy your life with me....";

const NO_LINES = [
  "Nice try 😏","Too slow!","Are you sure? 🥺","Wrong button 🙈","Just say yes 💕",
  "I'm shy, stop chasing me","Try the pink ones 👉","Almost got me!","Nope, not today"
];

/* ===== Year always current ===== */
document.getElementById('year').textContent = new Date().getFullYear();

/* ===== Floating hearts ===== */
(function(){
  const box = document.getElementById('hearts'), set = ['💗','💖','💕','🌸','✨'];
  for(let i=0;i<16;i++){
    const h = document.createElement('span');
    h.className='heart'; h.textContent=set[i%set.length];
    h.style.left=Math.random()*100+'%';
    h.style.fontSize=(14+Math.random()*20)+'px';
    h.style.animationDuration=(9+Math.random()*10)+'s';
    h.style.animationDelay=(-Math.random()*15)+'s';
    box.appendChild(h);
  }
})();

/* ===== Typewriter, then reveal the question ===== */
(function(){
  const el = document.getElementById('msg'), ask = document.getElementById('ask');
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduce){ el.textContent = MESSAGE; ask.classList.add('show'); return; }
  const cur = document.createElement('span'); cur.className='cursor';
  let i = 0; el.appendChild(cur);
  (function type(){
    if(i < MESSAGE.length){
      cur.before(MESSAGE[i++]);
      setTimeout(type, MESSAGE[i-1]==='.'||MESSAGE[i-1]==='—' ? 260 : 28);
    } else { cur.remove(); ask.classList.add('show'); }
  })();
  // let people skip the typing
  el.addEventListener('click',()=>{ i = MESSAGE.length; });
})();

/* ===== The runaway NO button ===== */
const no = document.getElementById('no'), hint = document.getElementById('hint');
const yesBtns = [...document.querySelectorAll('.yes')];
let tries = 0;

function overlaps(a,b,pad=14){
  return !(a.right+pad<b.left || a.left-pad>b.right || a.bottom+pad<b.top || a.top-pad>b.bottom);
}
function dodge(e){
  if(e){ e.preventDefault && e.preventDefault(); }
  no.classList.add('dodging');
  const w = no.offsetWidth, h = no.offsetHeight, m = 10;
  const maxX = window.innerWidth - w - m, maxY = window.innerHeight - h - m;
  let x, y, ok = false;
  for(let n=0;n<40 && !ok;n++){
    x = m + Math.random()*Math.max(0,maxX-m);
    y = m + Math.random()*Math.max(0,maxY-m);
    const r = {left:x,top:y,right:x+w,bottom:y+h};
    ok = !yesBtns.some(b=>overlaps(r,b.getBoundingClientRect()));
  }
  no.style.left = x+'px'; no.style.top = y+'px';
  tries++;
  hint.textContent = NO_LINES[(tries-1)%NO_LINES.length];
  // make the YES buttons friendlier each time
  const s = Math.min(1 + tries*0.03, 1.25);
  yesBtns.forEach(b=>b.style.transform='scale('+s+')');
}
['pointerenter','pointerdown','touchstart','mousedown','click','focus'].forEach(ev=>no.addEventListener(ev,dodge,{passive:false}));
window.addEventListener('resize',()=>{ if(no.classList.contains('dodging')) dodge(); });

/* ===== YES / Definitely yes ===== */
yesBtns.forEach(b=>b.addEventListener('click',()=>answer(b.dataset.answer)));

async function answer(text){
  document.getElementById('ask-wrap').style.display='none';
  no.style.display='none';
  const done = document.getElementById('done'); done.style.display='flex';
  confetti();
  const status = document.getElementById('status');
  if(!WEB3FORMS_KEY || WEB3FORMS_KEY.startsWith("YOUR_")){
    status.textContent = "(Setup note: add your Web3Forms key in the code to receive answers by email.)";
    return;
  }
  try{
    const fd = new FormData();
    fd.append("access_key", WEB3FORMS_KEY);
    fd.append("subject", "She answered: " + text);
    fd.append("from_name", "Proposal Page");
    fd.append("answer", text);
    fd.append("message", "She clicked: " + text);
    fd.append("time", new Date().toLocaleString());
    const r = await fetch("https://api.web3forms.com/submit",{ method:"POST", body:fd });
    const j = await r.json();
    status.textContent = (r.ok && j.success) ? "Sent ✓" :
      "Couldn't send (" + (j.message || r.status) + ") — please text Amol directly.";
  }catch(e){
    status.textContent = "No connection — please text Amol directly. 💕";
  }
}

/* ===== Confetti hearts ===== */
function confetti(){
  const c = document.getElementById('fx'), x = c.getContext('2d');
  const W = c.width = innerWidth, H = c.height = innerHeight;
  const emo = ['💖','💗','💕','🌸','✨','🎉'];
  const p = Array.from({length:90},()=>({
    x:Math.random()*W, y:-20-Math.random()*H*.5, v:2+Math.random()*4, s:16+Math.random()*20,
    d:(Math.random()-.5)*2, e:emo[Math.floor(Math.random()*emo.length)]
  }));
  let f = 0;
  (function loop(){
    x.clearRect(0,0,W,H);
    p.forEach(o=>{ o.y+=o.v; o.x+=o.d+Math.sin((o.y+f)/30); x.font=o.s+'px serif'; x.fillText(o.e,o.x,o.y); });
    f++;
    if(f<420) requestAnimationFrame(loop); else x.clearRect(0,0,W,H);
  })();
}
</script>
</body>
</html>
