<style>
:root{
  --bg1:#1c1033; --bg2:#3a1450; --rose:#ff5d8f; --peach:#ffb88c; --lilac:#d6c8ff; --text:#fff4f8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:'DM Sans',system-ui,sans-serif; color:var(--text); text-align:center;
  background:var(--bg1);
  padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);
  overflow-x:hidden;
}
#hearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.heart{position:absolute;bottom:-40px;opacity:.0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.7}100%{transform:translateY(-110vh) rotate(25deg);opacity:0}}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:14px 0 0}
h1{font-family:'Caveat',cursive;font-size:min(3.4rem,6.6vh,12vw);margin:0 0 4px;color:var(--peach);line-height:1}
/* Background: if you add a photo named bg.jpg next to index.html it shows on top.
   Otherwise the built-in romantic sunset artwork below is used (always works, no internet needed). */
#bg{position:fixed;inset:0;z-index:0;
  background:
    linear-gradient(180deg,rgba(28,16,51,.25) 0%,rgba(28,16,51,.7) 100%),
    url("bg.jpg") center/cover no-repeat,
    url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='1000' viewBox='0 0 800 1000'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='rgb(40,18,70)'/><stop offset='.55' stop-color='rgb(150,50,110)'/><stop offset='1' stop-color='rgb(255,140,120)'/></linearGradient><radialGradient id='m'><stop offset='0' stop-color='rgb(255,230,215)' stop-opacity='.85'/><stop offset='1' stop-color='rgb(255,230,215)' stop-opacity='0'/></radialGradient></defs><rect width='800' height='1000' fill='url(%23g)'/><circle cx='560' cy='330' r='260' fill='url(%23m)'/><circle cx='560' cy='330' r='100' fill='rgb(255,232,220)'/><g fill='white' opacity='.8'><circle cx='90' cy='120' r='2'/><circle cx='220' cy='210' r='1.6'/><circle cx='330' cy='90' r='2.2'/><circle cx='700' cy='140' r='2'/><circle cx='430' cy='200' r='1.5'/><circle cx='140' cy='330' r='1.8'/><circle cx='740' cy='430' r='1.6'/></g><path d='M0 800 Q200 720 400 790 T800 770 V1000 H0Z' fill='rgb(60,24,84)'/><path d='M0 880 Q250 820 500 870 T800 850 V1000 H0Z' fill='rgb(24,10,40)'/><g fill='rgb(24,10,40)'><circle cx='340' cy='742' r='20'/><rect x='322' y='764' width='36' height='92' rx='12'/><circle cx='412' cy='752' r='18'/><path d='M402 770 h20 l26 90 h-72Z'/></g><path d='M358 788 Q378 808 392 790' stroke='rgb(24,10,40)' stroke-width='8' fill='none' stroke-linecap='round'/><g fill='rgb(255,93,143)' opacity='.9'><path transform='translate(376 690) scale(1)' d='M0 -6 C-10 -18 -26 -2 0 18 C26 -2 10 -18 0 -6Z'/><path transform='translate(432 672) scale(.6)' d='M0 -6 C-10 -18 -26 -2 0 18 C26 -2 10 -18 0 -6Z'/><path transform='translate(322 676) scale(.5)' d='M0 -6 C-10 -18 -26 -2 0 18 C26 -2 10 -18 0 -6Z'/></g></svg>") center bottom/cover no-repeat,
    radial-gradient(1200px 700px at 50% -10%,var(--bg2),var(--bg1))}
.adv{font-size:min(1.05rem,2.2vh);color:var(--peach);margin:0 auto 6px;max-width:34ch}
h1,#msg,#ask h2,#hint{text-shadow:0 2px 14px rgba(0,0,0,.55)}
#msg{color:#f1e9ff}
#msg{font-size:min(1.05rem,2.2vh);line-height:1.5;color:var(--lilac);max-width:46ch;margin:0 auto}
#msg .cursor{display:inline-block;width:2px;height:1.1em;background:var(--rose);vertical-align:-3px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#ask{opacity:0;transform:translateY(12px);transition:opacity .8s,transform .8s;margin-top:6px}
#ask.show{opacity:1;transform:none}
#ask h2{font-family:'Caveat',cursive;font-size:min(2.4rem,5vh,9vw);margin:0 0 2px}
#hint{min-height:1.3em;color:var(--peach);font-size:.92rem;margin:2px 0 18px}
.btns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;min-height:50px}
button{font:inherit;font-weight:700;border:0;border-radius:999px;cursor:pointer;padding:13px 26px;color:#fff;touch-action:manipulation;transition:transform .15s,box-shadow .2s}
button:focus-visible,.name:focus-visible{outline:3px solid var(--lilac);outline-offset:3px}
.yes{background:linear-gradient(135deg,var(--rose),#ff8a5c);box-shadow:0 8px 24px rgba(255,93,143,.45)}
.yes:hover{transform:scale(1.06)}
.yes.big{background:linear-gradient(135deg,#ff2f78,var(--rose));font-size:1.1rem}
#no{background:#4a3a66;color:#e8def8}
#no.dodging{position:fixed;z-index:50;transition:left .18s ease-out,top .18s ease-out}
.done{display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding:9vh 0 100px}
.plan{width:100%;max-width:420px;margin:14px auto 4px;padding:16px 16px 18px;border-radius:20px;background:rgba(28,16,51,.64);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.plan h3{font-family:'Caveat',cursive;font-size:1.9rem;margin:0 0 2px;color:var(--peach);font-weight:700}
.plan .sub{margin:0 0 12px;font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);padding:9px 14px;font-size:.92rem;font-weight:500}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--rose),#ff8a5c);border-color:transparent;font-weight:700}
.when{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.when label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--lilac);text-align:left;flex:1 1 140px}
.when input{font:inherit;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:var(--text);color-scheme:dark;min-height:44px;width:100%}
.cta{width:100%;background:linear-gradient(135deg,var(--rose),#ff8a5c);box-shadow:0 8px 24px rgba(255,93,143,.4)}
.cta:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
#planStatus{font-size:.85rem;margin:8px 0 0;color:var(--peach)}
.plan{position:relative}
.plan .xbtn{display:block;position:absolute;top:6px;right:8px;background:none;padding:6px 10px;font-size:1.15rem;color:var(--lilac)}
.plan .sub:empty{display:none}
.datebtn{margin-top:12px;background:linear-gradient(135deg,#ffe9c9,var(--peach));color:#4a1d3a;font-weight:700;font-size:1rem;padding:12px 26px;box-shadow:0 6px 22px rgba(255,184,140,.5),inset 0 0 0 2px rgba(255,255,255,.45)}
.datebtn:hover{transform:scale(1.04)}
.datebtn.big{margin-top:16px;padding:14px 30px;font-size:1.05rem}
#planNote{margin:8px 0 0;font-size:.95rem;color:var(--peach)}
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:18px;overflow:auto;background:rgba(10,5,22,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.modal.open{display:flex}
.modal .plan{margin:auto}
.wa{display:inline-block;margin-top:18px;padding:15px 26px;border-radius:999px;background:#25d366;color:#073b1d;font-weight:700;text-decoration:none;box-shadow:0 8px 24px rgba(37,211,102,.35)}
.wa:focus-visible{outline:3px solid var(--lilac);outline-offset:3px}
.done h2{font-family:'Caveat',cursive;font-size:clamp(2.4rem,10vw,3.4rem);color:var(--peach);margin:10px 0}
.done p{color:var(--lilac);margin:6px 0}
#status{font-size:.85rem;opacity:.75}
footer{position:fixed;left:0;right:0;bottom:0;z-index:2;font-size:.74rem;line-height:1.35;color:rgba(255,244,248,.72);padding:6px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;pointer-events:none}
footer a{color:inherit;white-space:nowrap;pointer-events:auto}
footer .copy{display:block}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:100}
@media (prefers-reduced-motion:reduce){.heart{display:none}#no.dodging{transition:none}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div id="hearts" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<main>
  <section id="ask-wrap">
    <h1>Hey Dear,</h1>
    <p id="msg" aria-live="polite"></p>

    <div id="ask">
      <p class="adv">Life is an adventure, and I want to embark on the craziest journey with you!</p>
      <h2>Will you be mine?</h2>
      <p id="hint"></p>
      <div class="btns" id="btns">

    <a class="wa" id="wa" href="https://wa.me/917057868144?text=Hi%20Amol%2C%20I%20said%20yes!%20%F0%9F%92%96" target="_blank" rel="noopener">Message Amol on WhatsApp 💬</a>

</main>

<div class="modal" id="planModal" role="dialog" aria-modal="true" aria-label="Plan a date"><div id="modalSlot">
    <div class="plan" id="plan">
      <button type="button" class="xbtn" id="planClose" aria-label="Close">✕</button>
      <h3>Let's make a date plan 💕</h3>
      <p class="sub"></p>
      <div class="chips" id="chips" role="group" aria-label="Type of date">
        <button type="button" class="chip" data-type="Movie" aria-pressed="false">🎬 Movie</button>
        <button type="button" class="chip" data-type="Coffee" aria-pressed="false">☕ Coffee</button>
        <button type="button" class="chip" data-type="Lunch" aria-pressed="false">🍽️ Lunch</button>
        <button type="button" class="chip" data-type="Dinner" aria-pressed="false">🌙 Dinner</button>
        <button type="button" class="chip" data-type="Beach" aria-pressed="false">🌊 Beach</button>
        <button type="button" class="chip" data-type="Long drive" aria-pressed="false">🚗 Long drive</button>
        <button type="button" class="chip" data-type="Picnic" aria-pressed="false">🧺 Picnic</button>
        <button type="button" class="chip" data-type="Surprise me" aria-pressed="false">✨ Surprise me</button>
      </div>
      <div class="when">
        <label>Date<input type="date" id="dDate"></label>
        <label>Time<input type="time" id="dTime"></label>
      </div>
      <button type="button" class="cta" id="sendPlan" disabled>Send my plan 💌</button>
      <p id="planStatus"></p>
      <p id="planNote"></p>
    </div>
  </div></div>

<footer>
  <span class="copy">Amol Humane &copy; <span id="year"></span>. All rights reserved.</span>
  <a class="tel" href="tel:+917057868144">+91&nbsp;7057868144</a>
</footer>

<script>
/* ===== SETTINGS ===== */
// 1) Get a free key at https://web3forms.com (enter your email, they mail you the key)
// 2) Paste it below. Every answer will arrive in your inbox.
const WEB3FORMS_KEY = "b5c11d5b-c379-4177-afdf-7068d6cecf3a";

const MESSAGE = "You deserve the greatest, someone who will love you endlessly. Do you want to let me be the one? I will take care of you entire life. Once you hold my hand I will hold it forever. I don't want a perfect love. I want a real one, where we grow together in life and choose each other every single day. Would you like to live and enjoy your life with me....";

const NO_LINES = [
  "Nice try 😏","Too slow!","Are you sure? 🥺","Wrong button 🙈","Just say yes 💕",
  "I'm shy, stop chasing me","Try the pink ones 👉","Almost got me!","Nope, not today"
];

/* ===== Name from the link: ...amol?to=Priya  (no name = "Dear") ===== */
const TO = (new URLSearchParams(location.search).get('to') || '').replace(/\s+/g,' ').trim().slice(0,30);
if (TO) document.querySelector('h1').textContent = 'Hey ' + TO + ',';

/* ===== Year always current ===== */
document.getElementById('year').textContent = new Date().getFullYear();

/* ===== Floating hearts ===== */
(function(){
  const box = document.getElementById('hearts'), set = ['💗','💖','💕','🌸','✨'];
  for(let i=0;i<16;i++){
    const h = document.createElement('span');
    h.className='heart'; h.textContent=set[i%set.length];
    h.style.left=Math.random()*100+'%';
    h.style.fontSize=(14+Math.random()*20)+'px';
    h.style.animationDuration=(9+Math.random()*10)+'s';
    h.style.animationDelay=(-Math.random()*15)+'s';
    box.appendChild(h);
  }
})();

/* ===== Typewriter, then reveal the question ===== */
(function(){
  const el = document.getElementById('msg'), ask = document.getElementById('ask');
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  function start(){
    el.textContent = MESSAGE;                 // measure final height so layout never jumps
    el.style.minHeight = el.offsetHeight + 'px';
    if(reduce){ ask.classList.add('show'); return; }
    el.textContent = '';
    const cur = document.createElement('span'); cur.className='cursor';
    let i = 0; el.appendChild(cur);
    (function type(){
      if(i < MESSAGE.length){
        cur.before(MESSAGE[i++]);
        setTimeout(type, MESSAGE[i-1]==='.'||MESSAGE[i-1]==='—' ? 260 : 28);
      } else { cur.remove(); ask.classList.add('show'); }
    })();
    el.addEventListener('click',()=>{ i = MESSAGE.length; });   // tap to skip typing
  }
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start);
})();

/* ===== The runaway NO button ===== */
const no = document.getElementById('no'), hint = document.getElementById('hint');
const yesBtns = [...document.querySelectorAll('.yes')];
let tries = 0;

function overlaps(a,b,pad=14){
  return !(a.right+pad<b.left || a.left-pad>b.right || a.bottom+pad<b.top || a.top-pad>b.bottom);
}
function dodge(e){
  if(e){ e.preventDefault && e.preventDefault(); }
  no.classList.add('dodging');
  const w = no.offsetWidth, h = no.offsetHeight, m = 10;
  const maxX = window.innerWidth - w - m, maxY = window.innerHeight - h - m;
  let x, y, ok = false;
  for(let n=0;n<40 && !ok;n++){
    x = m + Math.random()*Math.max(0,maxX-m);
    y = m + Math.random()*Math.max(0,maxY-m);
    const r = {left:x,top:y,right:x+w,bottom:y+h};
    ok = ![...yesBtns, document.getElementById('dateBtn')].some(b=>overlaps(r,b.getBoundingClientRect()));
  }
  no.style.left = x+'px'; no.style.top = y+'px';
  tries++;
  hint.textContent = NO_LINES[(tries-1)%NO_LINES.length];
  // make the YES buttons friendlier each time
  const s = Math.min(1 + tries*0.03, 1.25);
  yesBtns.forEach(b=>b.style.transform='scale('+s+')');
}
['pointerenter','pointerdown','touchstart','mousedown','click','focus'].forEach(ev=>no.addEventListener(ev,dodge,{passive:false}));
window.addEventListener('resize',()=>{ if(no.classList.contains('dodging')) dodge(); });

/* ===== YES / Definitely yes ===== */
yesBtns.forEach(b=>b.addEventListener('click',()=>answer(b.dataset.answer)));

async function sendMail(subject, fields){
  if(!WEB3FORMS_KEY || WEB3FORMS_KEY.startsWith("YOUR_"))
    return {ok:false, msg:"(Setup note: add your Web3Forms key in the code to receive answers by email.)"};
  try{
    const fd = new FormData();
    fd.append("access_key", WEB3FORMS_KEY);
    fd.append("subject", subject);
    fd.append("from_name", "Proposal Page");
    if(TO) fd.append("name", TO);
    for(const k in fields) fd.append(k, fields[k]);
    fd.append("time_sent", new Date().toLocaleString());
    const r = await fetch("https://api.web3forms.com/submit",{ method:"POST", body:fd });
    const j = await r.json();
    return (r.ok && j.success) ? {ok:true} : {ok:false, msg:"Couldn't send (" + (j.message || r.status) + ")"};
  }catch(e){
    return {ok:false, msg:"No connection"};
  }
}

let saidYes = false, planSummary = '';

async function answer(text){
  saidYes = true;
  document.getElementById('planModal').classList.remove('open');
  document.getElementById('ask-wrap').style.display='none';
  no.style.display='none';
  const done = document.getElementById('done'); done.style.display='flex';
  if(planSummary){ document.getElementById('dateBtn2').textContent = '✓ Date planned'; document.getElementById('planNote').textContent = 'See you there! 💕'; }
  window.scrollTo(0,0);
  confetti();
  const status = document.getElementById('status');
  const fields = { answer:text, message:(TO || 'She') + " clicked: " + text };
  if(planSummary) fields.date_plan_already_sent = planSummary;
  const res = await sendMail((TO || 'She') + " answered: " + text, fields);
  status.textContent = res.ok ? "Sent ✓" : (res.msg.startsWith("(") ? res.msg : res.msg + " — please text Amol directly. 💕");
}

/* ===== Date planner popup: works before AND after YES ===== */
(function(){
  let planType = '';
  const plan = document.getElementById('plan'), modal = document.getElementById('planModal');
  const dateBtns = [...document.querySelectorAll('.datebtn')];
  const chips = [...document.querySelectorAll('.chip')];
  const dDate = document.getElementById('dDate'), dTime = document.getElementById('dTime');
  const sendBtn = document.getElementById('sendPlan'), ps = document.getElementById('planStatus');
  const note = document.getElementById('planNote');
  const pad = n => String(n).padStart(2,'0');
  const todayISO = () => { const t = new Date(); return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate()); };

  function problem(){                       // no past dates, and no past time today
    if(!dDate.value) return '';
    if(dDate.value < todayISO()) return 'Please pick today or a future date 💕';
    if(dDate.value === todayISO() && dTime.value){
      const n = new Date(), [h,m] = dTime.value.split(':').map(Number);
      if(h*60+m <= n.getHours()*60+n.getMinutes()) return 'That time has already passed. Pick a later time ⏰';
    }
    return '';
  }
  function check(){
    const pr = problem(); ps.textContent = pr;
    sendBtn.disabled = !(planType && dDate.value && dTime.value) || !!pr;
  }
  function openPlan(){ dDate.min = todayISO(); check(); modal.classList.add('open'); }
  function closePlan(){ modal.classList.remove('open'); }
  dateBtns.forEach(b=>b.addEventListener('click', openPlan));
  document.getElementById('planClose').addEventListener('click', closePlan);
  modal.addEventListener('click', e=>{ if(e.target===modal) closePlan(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closePlan(); });

  dDate.min = todayISO();
  chips.forEach(c=>c.addEventListener('click',()=>{
    planType = c.dataset.type;
    chips.forEach(x=>x.setAttribute('aria-pressed', x===c ? 'true' : 'false'));
    check();
  }));
  ['input','change'].forEach(ev=>{ dDate.addEventListener(ev,check); dTime.addEventListener(ev,check); });

  sendBtn.addEventListener('click', async ()=>{
    if(problem()){ check(); return; }
    sendBtn.disabled = true; sendBtn.textContent = 'Sending…'; ps.textContent = '';
    const [y,m,d] = dDate.value.split('-').map(Number);
    const dateTxt = new Date(y,m-1,d).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    const [hh,mm] = dTime.value.split(':').map(Number);
    const timeTxt = ((hh%12)||12)+':'+pad(mm)+' '+(hh<12?'AM':'PM');
    const who = TO ? ' from ' + TO : '';
    const res = await sendMail(
      'Date plan' + who + ': ' + planType + (saidYes ? '' : ' (has not answered yet)'),
      { answer: saidYes ? 'Yes, and here is our date plan' : "Hasn't answered yet, but planned a date 😄",
        date_type:planType, date:dateTxt, date_time:timeTxt });
    if(res.ok){
      planSummary = planType + ' · ' + dateTxt + ' · ' + timeTxt;
      plan.querySelector('h3').textContent = 'Date planned! 💕';
      plan.querySelector('.sub').textContent = planSummary;
      ['chips','sendPlan'].forEach(id=>document.getElementById(id).style.display='none');
      plan.querySelector('.when').style.display='none';
      dateBtns.forEach(b=>b.textContent = '✓ Date planned');
      document.getElementById('wa').href = 'https://wa.me/917057868144?text=' +
        encodeURIComponent('Hi Amol, I said yes! 💖 Our date: ' + planSummary);
      note.textContent = saidYes ? 'See you there! 💕' : 'Now, back to my question… 😉';
      setTimeout(closePlan, 2400);
    } else {
      ps.textContent = res.msg + ' — please text Amol directly.';
      sendBtn.disabled = false; sendBtn.textContent = 'Send my plan 💌';
    }
  });
})();

/* ===== Confetti hearts ===== */
function confetti(){
  const c = document.getElementById('fx'), x = c.getContext('2d');
  const W = c.width = innerWidth, H = c.height = innerHeight;
  const emo = ['💖','💗','💕','🌸','✨','🎉'];
  const p = Array.from({length:90},()=>({
    x:Math.random()*W, y:-20-Math.random()*H*.5, v:2+Math.random()*4, s:16+Math.random()*20,
    d:(Math.random()-.5)*2, e:emo[Math.floor(Math.random()*emo.length)]
  }));
  let f = 0;
  (function loop(){
    x.clearRect(0,0,W,H);
    p.forEach(o=>{ o.y+=o.v; o.x+=o.d+Math.sin((o.y+f)/30); x.font=o.s+'px serif'; x.fillText(o.e,o.x,o.y); });
    f++;
    if(f<420) requestAnimationFrame(loop); else x.clearRect(0,0,W,H);
  })();
}
</script>
</body>
</html>
